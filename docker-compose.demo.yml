services:
  db:
    image: postgres:16
    container_name: wastehub-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wastehub
      POSTGRES_USER: wastehub
      POSTGRES_PASSWORD: wastehub_demo_password
    volumes:
      - wastehub_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastehub -d wastehub"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wastehub-demo-api
    restart: unless-stopped
    environment:
      APP_NAME: WasteHub API
      APP_ENV: demo
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://wastehub:wastehub_demo_password@db:5432/wastehub
      SECRET_KEY: ${SECRET_KEY:-wastehub-demo-change-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: "240"
      MEDIA_ROOT: /app/media
      PAYMENT_PROVIDER: demo
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - wastehub_demo_media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: wastehub-demo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  wastehub_demo_postgres:
  wastehub_demo_media:
