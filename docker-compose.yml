name: wastehub

services:
  db:
    image: postgres:16
    container_name: wastehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - wastehub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wastehub-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-WasteHub API}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-240}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual_verification}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      WASTEHUB_ADMIN_NAME: ${WASTEHUB_ADMIN_NAME:-}
      WASTEHUB_ADMIN_EMAIL: ${WASTEHUB_ADMIN_EMAIL:-}
      WASTEHUB_ADMIN_PHONE: ${WASTEHUB_ADMIN_PHONE:-}
      WASTEHUB_ADMIN_PASSWORD: ${WASTEHUB_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - wastehub_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: wastehub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  wastehub_postgres:
  wastehub_media:
