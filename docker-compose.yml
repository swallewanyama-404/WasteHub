services:
  db:
    image: postgres:16
    container_name: wastehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wastehub
      POSTGRES_USER: wastehub
      POSTGRES_PASSWORD: wastehub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastehub -d wastehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
