name: WasteHub CI

on:
  push:
    branches:
      - main
      - ai/production-build
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wastehub
          POSTGRES_USER: wastehub
          POSTGRES_PASSWORD: wastehub_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wastehub -d wastehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://wastehub:wastehub_dev_password@localhost:5432/wastehub
      SECRET_KEY: ci-secret-key
      APP_ENV: test
      DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Compile backend
        run: python -m compileall backend

      - name: Apply migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Verify Alembic is clean
        run: python -m alembic -c backend/alembic.ini check

      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
